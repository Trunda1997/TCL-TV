plugins { id 'com.android.application' }

android {
    namespace 'de.tcltv.launcher'
    compileSdk 36

    defaultConfig {
        applicationId 'de.tcltv.launcher'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release { minifyEnabled false }
    }
}
